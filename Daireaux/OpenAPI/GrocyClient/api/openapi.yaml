    query:
      description: "An array of filter conditions, each of them is a string in the\
        \ form of `<field><condition><value>` where<br>`<field>` is a valid field\
        \ name<br>`<condition>` is a comparison operator, one of<br>&nbsp;&nbsp;`=`\
        \ equal<br>&nbsp;&nbsp;`!=` not equal<br>&nbsp;&nbsp;`~` LIKE<br>&nbsp;&nbsp;`!~`\
        \ not LIKE<br>&nbsp;&nbsp;`<` less<br>&nbsp;&nbsp;`>` greater<br>&nbsp;&nbsp;`<=`\
        \ less or equal<br>&nbsp;&nbsp;`>=` greater or equal<br>&nbsp;&nbsp;`§` regular\
        \ expression<br>`<value>` is the value to search for"
      explode: true
      in: query
      name: "query[]"
      required: false
      schema:
        items:
          type: string
        type: array
        default: null
      style: form
