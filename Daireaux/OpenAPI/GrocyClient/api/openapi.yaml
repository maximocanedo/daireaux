  parameters:
    order:
      description: "A valid field name by which the response should be ordered, use\
        \ the separator `:` to specify the sort order (`asc` or `desc`, defaults to\
        \ `asc` when omitted)"
      explode: true
      in: query
      name: order
      required: false
      schema:
        type: string
      style: form
    limit:
      description: The maximum number of objects to return
      explode: true
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    offset:
      description: The number of objects to skip
      explode: true
      in: query
      name: offset
      required: false
