openapi: 3.1.0
info:
  description: "Authentication is done via API keys (header *GROCY-API-KEY* or same\
    \ named query parameter), which you can manage [here](PlaceHolderManageApiKeysUrl).<br>Additionally\
    \ requests from within the frontend are also valid (via session cookie)."
  license:
    name: grocy.info
    url: https://grocy.info
  title: Grocy REST API
  version: xxx
servers:
- url: xxx
security:
- ApiKeyAuth: []
tags:
- description: A limited set of entities are directly exposed for convenience
  name: Generic entity interactions
- name: System
- name: User management
- name: Current user
- name: Stock
- description: "Some of the *Stock* routes, but access them by the products barcode\
    \ instead of its id"
  name: Stock "by-barcode"
- name: Recipes
- name: Chores
- name: Batteries
- name: Tasks
- name: Calendar
- name: Files
- name: Print
paths:
  /system/info:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_system_info_get_200_response"
          description: An DbChangedTimeResponse object
      summary: "Returns information about the installed Grocy version, PHP runtime\
        \ and OS"
      tags:
      - System
  /system/db-changed-time:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DbChangedTimeResponse"
          description: An DbChangedTimeResponse object
      summary: Returns the time when the database was last changed
      tags:
      - System
  /system/config:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                description: Key/value pairs of config settings
                type: object
          description: Key/value pairs of config settings
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Returns all config settings
      tags:
      - System
  /system/time:
    get:
      parameters:
      - $ref: "#/components/parameters/offsettime"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeResponse"
          description: A TimeResponse object
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Returns the current server time
      tags:
      - System
  /system/localization-strings:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                description: A gettext JSON representation
                type: object
          description: The operation was successful
      summary: Returns all localization strings (in the by the user desired language)
      tags:
      - System
  /system/log-missing-localization:
    post:
      description: "Only when MODE == 'dev', so should only be called then"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissingLocalizationRequest"
        description: A valid MissingLocalizationRequest object
        required: true
      responses:
        "204":
          description: The operation was successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Logs a missing localization string
      tags:
      - System
  /objects/{entity}:
    get:
      parameters:
      - description: A valid entity name
        explode: false
        in: path
        name: entity
        required: true
        schema:
          $ref: "#/components/schemas/ExposedEntity_NotIncludingNotListable"
        style: simple
      - $ref: "#/components/parameters/query"
      - $ref: "#/components/parameters/order"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/offset"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/_objects__entity__get_200_response_inner"
                type: array
                default: null
          description: An entity object
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error500"
          description: The operation was not successful (possible errors are invalid
            field names or conditions in filter parameters provided)
      summary: Returns all objects of the given entity
      tags:
      - Generic entity interactions
    post:
      parameters:
      - description: A valid entity name
        explode: false
        in: path
        name: entity
        required: true
        schema:
          $ref: "#/components/schemas/ExposedEntity_NotIncludingNotEditable"
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_objects__entity__get_200_response_inner"
        description: A valid entity object of the entity specified in parameter *entity*
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_objects__entity__post_200_response"
          description: The operation was successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Adds a single object of the given entity
      tags:
      - Generic entity interactions
  /objects/{entity}/{objectId}:
    delete:
      parameters:
      - description: A valid entity name
        explode: false
        in: path
        name: entity
        required: true
        schema:
          $ref: "#/components/schemas/ExposedEntity_NotIncludingNotDeletable"
        style: simple
      - description: A valid object id of the given entity
        explode: false
        in: path
        name: objectId
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "204":
          description: The operation was successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Deletes a single object of the given entity
      tags:
      - Generic entity interactions
    get:
      parameters:
      - description: A valid entity name
        explode: false
        in: path
        name: entity
        required: true
        schema:
          $ref: "#/components/schemas/ExposedEntity_NotIncludingNotListable"
        style: simple
      - description: A valid object id of the given entity
        explode: false
        in: path
        name: objectId
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_objects__entity__get_200_response_inner"
          description: An entity object
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: Object not found
      summary: Returns a single object of the given entity
      tags:
      - Generic entity interactions
    put:
      parameters:
      - description: A valid entity name
        explode: false
        in: path
        name: entity
        required: true
        schema:
          $ref: "#/components/schemas/ExposedEntity_NotIncludingNotEditable"
        style: simple
      - description: A valid object id of the given entity
        explode: false
        in: path
        name: objectId
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_objects__entity__get_200_response_inner"
        description: A valid entity object of the entity specified in parameter *entity*
        required: true
      responses:
        "204":
          description: The operation was successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Edits the given object of the given entity
      tags:
      - Generic entity interactions
  /userfields/{entity}/{objectId}:
    get:
      parameters:
      - description: A valid entity name
        explode: false
        in: path
        name: entity
        required: true
        schema:
          $ref: "#/components/schemas/ExposedEntity_IncludingUserEntities"
        style: simple
      - description: A valid object id of the given entity
        explode: false
        in: path
        name: objectId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                description: Key/value pairs of userfields
                type: object
          description: Key/value pairs of userfields
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Returns all userfields with their values of the given object of the
        given entity
      tags:
      - Generic entity interactions
    put:
      parameters:
      - description: A valid entity name
        explode: false
        in: path
        name: entity
        required: true
        schema:
          $ref: "#/components/schemas/ExposedEntity_IncludingUserEntities_NotIncludingNotEditable"
        style: simple
      - description: A valid object id of the given entity
        explode: false
        in: path
        name: objectId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              description: Key/value pairs of userfields
        description: A valid entity object of the entity specified in parameter *entity*
        required: true
      responses:
        "204":
          description: The operation was successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Edits the given userfields of the given object of the given entity
      tags:
      - Generic entity interactions
  /files/{group}/{fileName}:
    delete:
      parameters:
      - description: The file group
        explode: false
        in: path
        name: group
        required: true
        schema:
          $ref: "#/components/schemas/FileGroups"
        style: simple
      - description: The file name (including extension)<br>**BASE64 encoded**
        explode: false
        in: path
        name: fileName
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: The operation was successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Deletes the given file
      tags:
      - Files
    get:
      description: With proper Content-Type header
      parameters:
      - description: The file group
        explode: false
        in: path
        name: group
        required: true
        schema:
          $ref: "#/components/schemas/FileGroups"
        style: simple
      - description: The file name (including extension)<br>**BASE64 encoded**
        explode: false
        in: path
        name: fileName
        required: true
        schema:
          type: string
        style: simple
      - description: Force the file to be served as the given type
        explode: true
        in: query
        name: force_serve_as
        required: false
        schema:
          enum:
          - picture
          type: string
        style: form
      - description: "Only when using `force_serve_as` = `picture`: Downscale the\
          \ picture to the given height while maintaining the aspect ratio"
        explode: true
        in: query
        name: best_fit_height
        required: false
        schema:
          type: number
        style: form
      - description: "Only when using `force_serve_as` = `picture`: Downscale the\
          \ picture to the given width while maintaining the aspect ratio"
        explode: true
        in: query
        name: best_fit_width
        required: false
        schema:
          type: number
        style: form
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: The binary file contents (Content-Type header is automatically
            set based on the file type)
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Serves the given file
      tags:
      - Files
    put:
      description: "The file will be stored at /data/storage/{group}/{file_name} (you\
        \ need to remember the group and file name to get or delete it again)"
      parameters:
      - description: The file group
        explode: false
        in: path
        name: group
        required: true
        schema:
          $ref: "#/components/schemas/FileGroups"
        style: simple
      - description: The file name (including extension)<br>**BASE64 encoded**
        explode: false
        in: path
        name: fileName
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
      responses:
        "204":
          description: The operation was successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Uploads a single file
      tags:
      - Files
  /users:
    get:
      parameters:
      - $ref: "#/components/parameters/query"
      - $ref: "#/components/parameters/order"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/offset"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/UserDto"
                type: array
                default: null
          description: A list of user objects
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error500"
          description: The operation was not successful (possible errors are invalid
            field names or conditions in filter parameters provided)
      summary: Returns all users
      tags:
      - User management
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
        description: A valid user object
        required: true
      responses:
        "204":
          description: The operation was successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Creates a new user
      tags:
      - User management
  /users/{userId}:
    delete:
      parameters:
      - description: A valid user id
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "204":
          description: The operation was successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Deletes the given user
      tags:
      - User management
    put:
      parameters:
      - description: A valid user id
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
        description: A valid user object
        required: true
      responses:
        "204":
          description: The operation was successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Edits the given user
      tags:
      - User management
  /users/{userId}/permissions:
    get:
      description: See "GET /objects/permission_hierarchy" for a permission name /
        id mapping
      parameters:
      - description: A valid user id
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/_users__userId__permissions_get_200_response_inner"
                type: array
                default: null
          description: A list of user permission objects
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Returns the assigned permissions of the given user
      tags:
      - User management
    post:
      description: See "GET /objects/permission_hierarchy" for a permission name /
        id mapping
      parameters:
      - description: A valid user id
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_users__userId__permissions_post_request"
        required: true
      responses:
        "204":
          description: The operation was successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Adds a permission to the given user
      tags:
      - User management
    put:
      description: See "GET /objects/permission_hierarchy" for a permission name /
        id mapping
      parameters:
      - description: A valid user id
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_users__userId__permissions_put_request"
        required: true
      responses:
        "204":
          description: The operation was successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Replaces the assigned permissions of the given user
      tags:
      - User management
  /user:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/UserDto"
                type: object
          description: A user object
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Returns the currently authenticated user
      tags:
      - Current user
  /user/settings:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                description: Key/value pairs of user settings
                type: object
          description: Key/value pairs of user settings
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Returns all settings of the currently logged in user
      tags:
      - Current user
  /user/settings/{settingKey}:
    delete:
      parameters:
      - description: The key of the user setting
        explode: false
        in: path
        name: settingKey
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: The operation was successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Deletes the given setting of the currently logged in user
      tags:
      - Current user
    get:
      parameters:
      - description: The key of the user setting
        explode: false
        in: path
        name: settingKey
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSetting"
          description: A UserSetting object
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Returns the given setting of the currently logged in user
      tags:
      - Current user
    put:
      parameters:
      - description: The key of the user setting
        explode: false
        in: path
        name: settingKey
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSetting"
        description: A valid UserSetting object
        required: true
      responses:
        "204":
          description: The operation was successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: The operation was not successful
      summary: Sets the given setting of the currently logged in user
      tags:
      - Current user
  /stock:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CurrentStockResponse"
                type: array
                default: null
          description: An array of CurrentStockResponse objects
      summary: Returns all products which are currently in stock incl. the next due
        date per product
      tags:
      - Stock
  /stock/entry/{entryId}:
    get:
      parameters:
      - description: A valid stock entry id
        explode: false
        in: path
        name: entryId
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockEntry"
          description: A StockEntry Response object
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: "The operation was not successful (possible errors are: Not\
            \ existing product)"
      summary: Returns details of the given stock
      tags:
      - Stock
    put:
      parameters:
      - description: A valid stock entry id
        explode: false
        in: path
        name: entryId
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_stock_entry__entryId__put_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/StockLogEntry"
                type: array
                default: null
          description: The operation was successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: "The operation was not successful (possible errors are: Not\
            \ existing product, invalid transaction type)"
      summary: Edits the stock entry
      tags:
      - Stock
  /stock/entry/{entryId}/printlabel:
    get:
      parameters:
      - description: A valid stock entry id
        explode: false
        in: path
        name: entryId
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                description: WebHook data
                type: object
          description: The operation was successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: "The operation was not successful (possible errors are: Not\
            \ existing stock entry, error on WebHook execution)"
      summary: Prints the Grocycode / stock entry label of the given entry on the
        configured label printer
      tags:
      - Stock
  /stock/volatile:
    get:
      parameters:
      - description: The number of days in which products are considered to be due
          soon
        explode: true
        in: query
        name: due_soon_days
        required: false
        schema:
          default: 5
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentVolatilStockResponse"
          description: A CurrentVolatilStockResponse object
      summary: "Returns all products which are due soon, overdue, expired or currently\
        \ missing"
      tags:
      - Stock
  /stock/products/{productId}:
    get:
      parameters:
      - description: A valid product id
        explode: false
        in: path
        name: productId
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetailsResponse"
          description: A ProductDetailsResponse object
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
          description: "The operation was not successful (possible errors are: Not\
            \ existing product)"
      summary: Returns details of the given product
      tags:
      - Stock
  /stock/products/{productId}/locations:
    get:
      parameters:
      - description: A valid product id
        explode: false
        in: path
        name: productId
        required: true
        schema:
          type: integer
        style: simple
      - description: If sub product locations should be included (if the given product
          is a parent product and in addition to the ones of the given product)
        explode: true
        in: query
        name: include_sub_products
        required: false
        schema:
          type: boolean
        style: form
      - $ref: "#/components/parameters/query"
      - $ref: "#/components/parameters/order"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/offset"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/StockLocation"
                type: array
                default: null
          description: An array of StockLocation objects
        "400":
